services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staffsync
      POSTGRES_USER: staffsync
      POSTGRES_PASSWORD: staffsync
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U staffsync -d staffsync"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://staffsync:staffsync@postgres:5432/staffsync
      JWT_SECRET: staffsync-dev-secret-change-me
      JWT_REFRESH_SECRET: staffsync-refresh-secret-change-me
      CLIENT_URL: http://localhost:4200
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  pgdata:
